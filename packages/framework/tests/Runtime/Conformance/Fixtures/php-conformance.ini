; Mounted into the FrankenPHP and PHP-FPM containers the integration job
; runs the conformance fixture under; SuperglobalsDriver passes the same
; values as -d flags when it spawns php -S itself.
;
; post_max_size: low enough that the 5 KB form body the suite sends as
; "unparseable" trips request_parse_body(), high enough that its ordinary
; multipart bodies (a few hundred bytes) parse. Form bodies only — a raw
; 1 MiB body is unaffected, which the suite also checks.
post_max_size=2K
upload_max_filesize=1K
; Not load-bearing for the streaming case (the emitter closes any output
; buffer itself, as a real one must), but keeps each environment's
; baseline identical.
output_buffering=0
