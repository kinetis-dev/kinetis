; Mounted into the FrankenPHP and PHP-FPM containers the integration job
; runs the conformance fixture under; SuperglobalsDriver passes the same
; values as -d flags when it spawns php -S itself.
;
; enable_post_data_reading=0 is a requirement of the Kinetis SAPI
; adapters, not a test convenience: Kinetis\Runtime\SuperglobalsBridge
; refuses to run without it, because with it on PHP reads and parses the
; request body before any Kinetis code exists — truncating it at PHP's
; own limits, emptying php://input, and leaving nothing that can tell a
; truncated form from a complete one. See the "Form bodies: one contract
; under every runtime" section of docs/runtime-adapters.md.
enable_post_data_reading=0
; Not load-bearing for the streaming case (the emitter closes any output
; buffer itself, as a real one must), but keeps each environment's
; baseline identical.
output_buffering=0
