server {
    listen 8080;

    # Resolve the Compose service at request time so recreating the app
    # container does not leave nginx pinned to its previous address.
    resolver 127.0.0.11 valid=5s ipv6=off;

    root /app/public;
    index index.php;

    # nginx reads the body before PHP does, so this must be at least
    # Kinetis's MAX_BODY_SIZE; raise both together.
    client_max_body_size 2m;

    location / {
        try_files $uri /index.php$is_args$args;
    }

    location ~ \.php$ {
        set $php_fpm app:9000;
        fastcgi_pass $php_fpm;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME /app/public/index.php;
        include fastcgi_params;
    }
}
