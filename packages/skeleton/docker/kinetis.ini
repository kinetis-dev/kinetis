# Kinetis reads and bounds the request body itself, so PHP must not.
# Left at its default, PHP parses form bodies before any Kinetis code
# runs — truncating them at its own max_input_vars/post_max_size limits,
# leaving php://input empty, and giving a handler no way to tell a
# truncated form from a complete one. Kinetis\Runtime\SuperglobalsBridge
# refuses to serve a request without this rather than running on a body
# PHP already consumed. It is PHP_INI_PERDIR, so it has to be set here
# and cannot be set from application code.
enable_post_data_reading=0

# Application errors belong in the container logs, never in the
# response. The base image activates no php.ini, which leaves PHP's own
# display_errors on: a warning raised before the framework writes its
# error response goes into the body, and once output has begun
# Kinetis\Runtime\SuperglobalsBridge can no longer set the status or the
# headers — the response then carries 200 and HTML ahead of the document
# it was supposed to be. log_errors keeps the diagnostic, which PHP-FPM
# writes to its error log on stderr for `docker compose logs`.
display_errors=Off
display_startup_errors=Off
log_errors=On
