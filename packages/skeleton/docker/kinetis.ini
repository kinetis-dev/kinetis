# Kinetis reads and bounds the request body itself, so PHP must not.
# Left at its default, PHP parses form bodies before any Kinetis code
# runs — truncating them at its own max_input_vars/post_max_size limits,
# leaving php://input empty, and giving a handler no way to tell a
# truncated form from a complete one. Kinetis\Runtime\SuperglobalsBridge
# refuses to serve a request without this rather than running on a body
# PHP already consumed. It is PHP_INI_PERDIR, so it has to be set here
# and cannot be set from application code.
enable_post_data_reading=0
