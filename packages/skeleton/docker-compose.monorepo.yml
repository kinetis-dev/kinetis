# Contributor-only, for running this project from inside the kinetis
# monorepo:
#
#   docker compose -f docker-compose.yml -f docker-compose.monorepo.yml up --build
#
# Here composer.json still carries the `path` repositories the monorepo
# develops against (the released package has none), and a path
# repository resolves relative to the composer.json's own directory. The
# project is /app in every mode, so `../orbitron` is /orbitron — and
# mounting the four declared siblings at those paths is the entire
# difference between the two modes. Every container path stays exactly what the
# released package uses, so the Dockerfile, nginx.conf and the base
# compose file need no monorepo variant of their own.
services:
  app:
    volumes:
      - ../orbitron:/orbitron
      - ../mcp-docs:/mcp-docs
      - ../mcp-protocol:/mcp-protocol
      - ../framework:/framework
