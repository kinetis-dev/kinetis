# Two suites cover these classes. PHPUnit covers their pure PHP
# behavior — argument validation, envelope encoding and its round trip,
# settlement fencing against a scripted link — and runs in this job.
# Backend semantics are covered by integration.yml against real
# containers and the pingpong compose stack (see docs/queue.md,
# docs/queue-redis.md, docs/queue-sql.md, docs/queue-sqs.md,
# docs/queue-rabbitmq.md, docs/session.md). This job does not run the
# suites that reach these files' backend paths, so the lines only those
# suites cover would read as uncovered here. Excluding the files keeps
# the metric to what this job measures. The XxxQueueFactory construction
# classes are not excluded: no backend decides what they do.
# SqsQueueException is only ever thrown from SqsQueue's own code path.
# The Console commands and PackageBootstrap classes are thin wiring over
# the same backends, and RedisSessionStore is the same case.
sonar.coverage.exclusions=\
  packages/session/src/Store/RedisSessionStore.php,\
  packages/queue-redis/src/RedisQueue.php,\
  packages/queue-sql/src/SqlQueue.php,\
  packages/queue/src/PackageBootstrap.php,\
  packages/queue/src/Console/WorkCommand.php,\
  packages/database-bridge/src/PackageBootstrap.php,\
  packages/migrations/src/Console/*,\
  packages/queue-sqs/src/SqsQueue.php,\
  packages/queue-sqs/src/Exception/SqsQueueException.php,\
  packages/queue-rabbitmq/src/RabbitMqQueue.php

# Two accepted structural duplications are package boundaries, not gaps.
# DocsApplication and PackageSourceReader both scan bounded lines for a
# literal string, but mcp-docs is independently installable and Orbitron
# depends on it. Moving package-source policy into mcp-docs would cross its
# fixed-document trust boundary; moving content search into mcp-protocol
# would give the transport package behavior it does not own.
#
# MysqliAsyncClient::runPooled()/PgsqlAsyncClient::runPooled() share the
# same acquire-run-release-with-one-retry shape, but acquire()/release()
# aren't trait-compatible across the two (different connection types,
# different release() arity) — an extraction would widen both drivers'
# production connection-pool/retry signatures.
sonar.cpd.exclusions=\
  packages/mcp-docs/src/DocsApplication.php,\
  packages/persistence/src/Driver/MysqliAsyncClient.php,\
  packages/persistence/src/Driver/PgsqlAsyncClient.php

# DocsApplication is the single owner of one MCP application's metadata,
# schemas, validation, fixed catalogue, fetch diagnostics and result
# envelopes. Splitting that cohesive boundary by method count would add
# delegation and state ownership without creating an independent component.
#
# RedisSimpleCache implements the cache, atomic-operation and disposal
# contracts over one executor, serializer, prefix and ownership boundary.
# Splitting it by method count would add delegation without separating an
# independent responsibility.
#
# NullTelemetry is the framework's null-object TelemetryInterface backend:
# every hook is empty or returns a null/empty token by contract, already
# stated once in its class docblock. Repeating that per method is worse
# than the empty bodies it would explain.
sonar.issue.ignore.multicriteria=mcpDocsApplicationCohesion,redisSimpleCacheCohesion,nullTelemetryNoOps
sonar.issue.ignore.multicriteria.mcpDocsApplicationCohesion.ruleKey=php:S1448
sonar.issue.ignore.multicriteria.mcpDocsApplicationCohesion.resourceKey=packages/mcp-docs/src/DocsApplication.php
sonar.issue.ignore.multicriteria.redisSimpleCacheCohesion.ruleKey=php:S1448
sonar.issue.ignore.multicriteria.redisSimpleCacheCohesion.resourceKey=packages/cache-redis/src/RedisSimpleCache.php
sonar.issue.ignore.multicriteria.nullTelemetryNoOps.ruleKey=php:S1186
sonar.issue.ignore.multicriteria.nullTelemetryNoOps.resourceKey=packages/framework/src/Instrumentation/NullTelemetry.php
