# SonarQube Cloud configuration.
#
# `sonar.organization`/`sonar.projectKey` must match the values on the
# project's own SonarCloud dashboard.
sonar.organization=kinetis-dev
sonar.projectKey=kinetis-dev_kinetis
sonar.projectName=Kinetis

# Core plus every satellite package's own src/ — one flat list, since
# SonarPHP has no concept of this repo's Composer package boundaries.
sonar.sources=\
  packages/framework/src,\
  packages/persistence/src,\
  packages/cache-redis/src,\
  packages/auth/src,\
  packages/auth-jwt/src,\
  packages/bref-adapter/src,\
  packages/roadrunner-adapter/src,\
  packages/mailer/src,\
  packages/broadcasting/src,\
  packages/migrations/src,\
  packages/mcp/src,\
  packages/query-builder/src,\
  packages/queue/src,\
  packages/queue-redis/src,\
  packages/queue-sql/src,\
  packages/queue-rabbitmq/src,\
  packages/queue-sqs/src,\
  packages/revolt-http-client/src,\
  packages/aws-sigv4/src,\
  packages/search-opensearch/src,\
  packages/telemetry/src,\
  packages/session/src,\
  packages/pingpong/src,\
  packages/skeleton/src,\
  packages/storage/src,\
  packages/storage-s3/src

sonar.exclusions=**/vendor/**

sonar.sourceEncoding=UTF-8

# Clover coverage reports, one per package with a PHPUnit suite —
# kinetis/pingpong has none by design, so it's absent here and simply
# reports no coverage data, matching reality rather than a gap.
sonar.php.coverage.reportPaths=\
  packages/framework/coverage.xml,\
  packages/persistence/coverage.xml,\
  packages/cache-redis/coverage.xml,\
  packages/auth/coverage.xml,\
  packages/auth-jwt/coverage.xml,\
  packages/bref-adapter/coverage.xml,\
  packages/roadrunner-adapter/coverage.xml,\
  packages/mailer/coverage.xml,\
  packages/broadcasting/coverage.xml,\
  packages/migrations/coverage.xml,\
  packages/mcp/coverage.xml,\
  packages/pingpong/coverage.xml,\
  packages/query-builder/coverage.xml,\
  packages/queue/coverage.xml,\
  packages/queue-redis/coverage.xml,\
  packages/queue-sql/coverage.xml,\
  packages/queue-rabbitmq/coverage.xml,\
  packages/queue-sqs/coverage.xml,\
  packages/revolt-http-client/coverage.xml,\
  packages/aws-sigv4/coverage.xml,\
  packages/search-opensearch/coverage.xml,\
  packages/telemetry/coverage.xml,\
  packages/session/coverage.xml,\
  packages/skeleton/coverage.xml,\
  packages/storage/coverage.xml,\
  packages/storage-s3/coverage.xml

# These backend-implementation classes have no PHPUnit coverage by
# design — each is tested only against a real backend container (see
# docs/queue.md, docs/queue-redis.md, docs/queue-sql.md,
# docs/queue-sqs.md, docs/queue-rabbitmq.md). Their own XxxQueueFactory
# construction classes are unit-tested and deliberately not listed here.
# SqsQueueException is only ever thrown from SqsQueue's own code path.
# The Console commands and PackageBootstrap classes are thin wiring over
# those same backends, verified the same way — through real MySQL/Redis
# containers and the pingpong compose stack — never against a mock.
sonar.coverage.exclusions=\
  packages/queue-redis/src/RedisQueue.php,\
  packages/queue-sql/src/SqlQueue.php,\
  packages/queue/src/PackageBootstrap.php,\
  packages/queue/src/Console/WorkCommand.php,\
  packages/persistence/src/PackageBootstrap.php,\
  packages/migrations/src/Console/*,\
  packages/queue-sqs/src/SqsQueue.php,\
  packages/queue-sqs/src/Exception/SqsQueueException.php,\
  packages/queue-rabbitmq/src/RabbitMqQueue.php

# Two known, accepted pairs of structural duplication, not gaps:
# - MysqliAsyncClient::runPooled()/PgsqlAsyncClient::runPooled() share
#   the same acquire-run-release-with-one-retry shape, but acquire()/
#   release() aren't trait-compatible across the two (different
#   connection types, different release() arity) — a real extraction
#   would mean widening both drivers' signatures, production
#   connection-pool/retry code this project only ships after
#   re-verifying against live MySQL/MariaDB/Postgres, not something to
#   do as a side effect of an unrelated change.
# - RoadRunnerAdapter::parseMultipart()/BrefLambdaAdapter::parseMultipart()
#   are two genuinely independent satellite packages doing the identical
#   riverline/multipart-parser integration for the identical reason —
#   extracting it would mean either a new shared package or a
#   dependency between two otherwise-unrelated runtime adapters, against
#   this project's own "no satellite depends on a sibling satellite
#   without a real reason" convention.
sonar.cpd.exclusions=\
  packages/persistence/src/Driver/MysqliAsyncClient.php,\
  packages/persistence/src/Driver/PgsqlAsyncClient.php,\
  packages/roadrunner-adapter/src/RoadRunnerAdapter.php,\
  packages/bref-adapter/src/BrefLambdaAdapter.php
