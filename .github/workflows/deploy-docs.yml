name: Deploy Docs

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - '.github/workflows/deploy-docs.yml'
  workflow_dispatch:

permissions:
  contents: read

# One deployment at a time, never cancelled: a cancelled `s3 sync
# --delete` would leave the docs half old, half new. A later push waits
# and then publishes its own build over this one.
concurrency:
  group: deploy-docs
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy docs
    runs-on: ubuntu-latest
    # The OIDC token for the AWS role, on this job only.
    permissions:
      id-token: write
      contents: read
    # No `environment:` here, on purpose. The role's OIDC trust policy is
    # pinned to this repository's main branch, and a job that declares an
    # environment presents an environment subject instead, which the role
    # refuses. workflow_dispatch from any branch but main is refused the
    # same way.
    steps:
      - uses: actions/checkout@v7

      - name: Build Sphinx docs
        run: |
          docker run --rm -v "$PWD/docs":/app -w /app python:3.12-slim \
            bash -c "pip install -q -r requirements.txt && sphinx-build -M html . _build -W --keep-going && python -m pagefind --site _build/html"

      - name: Check URL baseline
        run: python3 docs/tools/check_url_baseline.py check docs/_build/html --catalogue packages/mcp-docs/src/DocsCatalogue.php

      # github-actions-kinetis-docs-deploy is this repository's own role:
      # its OIDC trust is per repository, so it can't be swapped for
      # kinetis-website's role, whose trust names a different repository.
      # The role allows only what this job does: ListBucket under the
      # docs/ prefix, Get/Put/Delete on kinetis.dev/docs/*, and
      # invalidation on the kinetis.dev distribution.
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::227129576823:role/github-actions-kinetis-docs-deploy
          aws-region: eu-west-1

      # A destination prefix, not the bucket root: `aws s3 sync --delete`
      # only ever deletes keys under the given destination, so this can
      # never touch anything outside docs/ -- kinetis-website's own root
      # sync is the one that needs an explicit --exclude to leave this
      # prefix alone, since *its* destination is the bucket root.
      - name: Sync to S3
        run: |
          aws s3 sync docs/_build/html s3://kinetis.dev/docs/ \
            --exclude ".doctrees/*" --exclude ".buildinfo" --delete

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation --distribution-id E3SMHJBBV2860Z --paths '/docs/*'
