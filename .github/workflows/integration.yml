name: Integration

on:
  push:
    branches: [main]
    paths:
      - 'packages/**'
      - '.github/workflows/integration.yml'
  pull_request:
    paths:
      - 'packages/**'
      - '.github/workflows/integration.yml'

# One run per branch at a time: a superseded PR push cancels the older
# run outright; on main nothing is cancelled, but stacked pushes queue
# as at most one pending run instead of piling their whole job matrix
# behind each other's. release.yml groups on a constant instead of this
# per-ref pair, and never cancels — see that file for why a publication
# needs both.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  # Composer runs natively in this workflow rather than in a container,
  # so the cache is addressed by COMPOSER_CACHE_DIR instead of a mount.
  # See ci.yml for why both exist.
  #
  # github.workspace, not runner.temp: a workflow-level env block can only
  # read the github, inputs, secrets and vars contexts, and runner is not
  # among them. It resolves inside a job container too, which the
  # redis-cluster job needs.
  COMPOSER_CACHE_DIR: ${{ github.workspace }}/.composer-cache
  COMPOSER_AUTH: '{"github-oauth":{"github.com":"${{ secrets.GITHUB_TOKEN }}"}}'

jobs:
  query-builder:
    name: query-builder (${{ matrix.mysql.name }} + Postgres, PHP ${{ matrix.php-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php-version: ['8.4', '8.5']
        mysql:
          - { name: MySQL, image: "mysql:8.4", healthCmd: "mysqladmin ping -h localhost -u root -proot" }
          - { name: MariaDB, image: "mariadb:11.4", healthCmd: "mariadb-admin ping -h localhost -u root -proot" }
    services:
      mysql:
        image: ${{ matrix.mysql.image }}
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: testdb
          MYSQL_USER: testuser
          MYSQL_PASSWORD: testpass
        ports:
          - 3306:3306
        options: >-
          --health-cmd="${{ matrix.mysql.healthCmd }}"
          --health-interval=5s --health-timeout=5s --health-retries=10
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: testdb
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpass
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U testuser"
          --health-interval=5s --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: pgsql

      - name: Cache Composer downloads
        uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/.composer-cache
          key: composer-${{ hashFiles('packages/*/composer.lock', 'tools/composer.lock') }}
          restore-keys: composer-
      - name: Install dependencies
        working-directory: packages/query-builder
        run: composer install --no-interaction --prefer-dist

      - name: Run integration checks
        working-directory: packages/query-builder
        run: php tests-integration/run.php
        env:
          MYSQL_HOST: 127.0.0.1
          POSTGRES_HOST: 127.0.0.1

      - name: Cursor-pagination integration tests
        # tests/Integration/ lives in the normal phpunit suite,
        # environment-gated the same way persistence's does: it skips
        # without MYSQL_HOST/POSTGRES_HOST, so plain unit runs elsewhere
        # stay database-free. Run here as well as under coverage in the
        # SonarQube workflow, so these cases get this job's full matrix
        # (MariaDB and PHP 8.5 included) rather than only the single
        # MySQL 8.4 + PHP 8.4 combination that job pins.
        working-directory: packages/query-builder
        run: vendor/bin/phpunit
        env:
          MYSQL_HOST: 127.0.0.1
          POSTGRES_HOST: 127.0.0.1

  queue-redis:
    name: queue-redis (Redis, PHP ${{ matrix.php-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php-version: ['8.4', '8.5']
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}

      - name: Cache Composer downloads
        uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/.composer-cache
          key: composer-${{ hashFiles('packages/*/composer.lock', 'tools/composer.lock') }}
          restore-keys: composer-
      - name: Install dependencies
        working-directory: packages/queue-redis
        run: composer install --no-interaction --prefer-dist

      - name: Run integration checks
        working-directory: packages/queue-redis
        run: php tests-integration/run.php
        env:
          REDIS_HOST: 127.0.0.1

      - name: Run RedisQueue delayed-job race check (10 concurrent processes)
        working-directory: packages/queue-redis
        run: php tests-integration/redis_delayed_race.php
        env:
          REDIS_HOST: 127.0.0.1

      - name: Run RedisQueue duplicate-payload check
        working-directory: packages/queue-redis
        run: php tests-integration/redis_duplicate_jobs.php
        env:
          REDIS_HOST: 127.0.0.1

      - name: Run RedisQueue atomic-transition check
        working-directory: packages/queue-redis
        run: php tests-integration/redis_atomic_transitions.php
        env:
          REDIS_HOST: 127.0.0.1

      - name: Run RedisQueue bounded delayed-promotion check
        working-directory: packages/queue-redis
        run: php tests-integration/redis_bounded_promotion.php
        env:
          REDIS_HOST: 127.0.0.1

  queue-sql:
    name: queue-sql (${{ matrix.mysql.name }}, PHP ${{ matrix.php-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php-version: ['8.4', '8.5']
        mysql:
          - { name: MySQL, image: "mysql:8.4", healthCmd: "mysqladmin ping -h localhost -u root -proot" }
          - { name: MariaDB, image: "mariadb:11.4", healthCmd: "mariadb-admin ping -h localhost -u root -proot" }
    services:
      mysql:
        image: ${{ matrix.mysql.image }}
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: testdb
          MYSQL_USER: testuser
          MYSQL_PASSWORD: testpass
        ports:
          - 3306:3306
        options: >-
          --health-cmd="${{ matrix.mysql.healthCmd }}"
          --health-interval=5s --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}

      - name: Cache Composer downloads
        uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/.composer-cache
          key: composer-${{ hashFiles('packages/*/composer.lock', 'tools/composer.lock') }}
          restore-keys: composer-
      - name: Install dependencies
        working-directory: packages/queue-sql
        run: composer install --no-interaction --prefer-dist

      - name: Run integration checks
        working-directory: packages/queue-sql
        run: php tests-integration/run.php
        env:
          MYSQL_HOST: 127.0.0.1

  queue-rabbitmq:
    name: queue-rabbitmq (RabbitMQ, PHP ${{ matrix.php-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php-version: ['8.4', '8.5']
    services:
      rabbitmq:
        image: rabbitmq:3-management
        ports:
          - 5672:5672
        options: >-
          --health-cmd="rabbitmq-diagnostics -q ping"
          --health-interval=5s --health-timeout=5s --health-retries=15
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}

      - name: Cache Composer downloads
        uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/.composer-cache
          key: composer-${{ hashFiles('packages/*/composer.lock', 'tools/composer.lock') }}
          restore-keys: composer-
      - name: Install dependencies
        working-directory: packages/queue-rabbitmq
        run: composer install --no-interaction --prefer-dist

      - name: Run integration checks
        working-directory: packages/queue-rabbitmq
        run: php tests-integration/run.php
        env:
          RABBITMQ_URL: amqp://guest:guest@127.0.0.1:5672/

  persistence-and-cache-redis:
    # Renamed from the original "core" job: TransactionGuard/
    # RedisSimpleCache both moved out of kinetis/framework into their own
    # satellite packages (kinetis/persistence, kinetis/cache-redis), so
    # core itself has no remaining real-backend-dependent code at all.
    name: persistence + cache-redis (TransactionGuard on ${{ matrix.mysql.name }} + RedisSimpleCache, PHP ${{ matrix.php-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php-version: ['8.4', '8.5']
        mysql:
          - { name: MySQL, image: "mysql:8.4", healthCmd: "mysqladmin ping -h localhost -u root -proot" }
          - { name: MariaDB, image: "mariadb:11.4", healthCmd: "mariadb-admin ping -h localhost -u root -proot" }
    services:
      mysql:
        image: ${{ matrix.mysql.image }}
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: testdb
          MYSQL_USER: testuser
          MYSQL_PASSWORD: testpass
        ports:
          - 3306:3306
        options: >-
          --health-cmd="${{ matrix.mysql.healthCmd }}"
          --health-interval=5s --health-timeout=5s --health-retries=10
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: testdb
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpass
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U testuser"
          --health-interval=5s --health-timeout=5s --health-retries=10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: pgsql

      - name: Cache Composer downloads
        uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/.composer-cache
          key: composer-${{ hashFiles('packages/*/composer.lock', 'tools/composer.lock') }}
          restore-keys: composer-
      - name: Install persistence dependencies
        working-directory: packages/persistence
        run: composer install --no-interaction --prefer-dist

      - name: Start TLS-configured MySQL and Postgres
        # TlsTest needs servers presenting certificates the runner also
        # holds the CA for, plus a wrong CA for the fail-closed checks —
        # service containers can't mount runner files at job start, so
        # these two run as plain containers after generating the PKI.
        run: |
          mkdir -p /tmp/tls-certs && cd /tmp/tls-certs
          openssl genrsa -out ca.key 2048
          openssl req -x509 -new -key ca.key -sha256 -days 2 -subj "/CN=CI Test CA" -out ca.pem
          openssl genrsa -out wrong-ca.key 2048
          openssl req -x509 -new -key wrong-ca.key -sha256 -days 2 -subj "/CN=Wrong CA" -out wrong-ca.pem
          openssl genrsa -out server.key 2048
          openssl req -new -key server.key -subj "/CN=127.0.0.1" -out server.csr
          printf "subjectAltName=DNS:localhost,IP:127.0.0.1\n" > san.ext
          openssl x509 -req -in server.csr -CA ca.pem -CAkey ca.key -CAcreateserial -days 2 -sha256 -extfile san.ext -out server.pem
          # Client certificate for the mutual-TLS cases. Its CN is the
          # database username both servers authenticate it as.
          openssl genrsa -out client.key 2048
          openssl req -new -key client.key -subj "/CN=mtlsuser" -out client.csr
          openssl x509 -req -in client.csr -CA ca.pem -CAkey ca.key -CAcreateserial -days 2 -sha256 -out client.pem
          chmod 644 server.key ca.pem server.pem wrong-ca.pem client.pem
          # libpq refuses a client key readable by group or world.
          chmod 600 client.key
          docker run -d --name mysql-tls -p 3307:3306 -v /tmp/tls-certs:/certs:ro \
            -e MYSQL_DATABASE=testdb -e MYSQL_USER=testuser -e MYSQL_PASSWORD=testpass -e MYSQL_ROOT_PASSWORD=root \
            ${{ matrix.mysql.image }} --ssl-ca=/certs/ca.pem --ssl-cert=/certs/server.pem --ssl-key=/certs/server.key
          docker run -d --name pg-tls -p 5433:5432 -v /tmp/tls-certs:/certs-src:ro \
            -e POSTGRES_DB=testdb -e POSTGRES_USER=testuser -e POSTGRES_PASSWORD=testpass \
            --entrypoint bash postgres:16 -c 'cp /certs-src/server.pem /certs-src/server.key /certs-src/ca.pem /tmp/ && chown postgres /tmp/server.* /tmp/ca.pem && chmod 600 /tmp/server.key && printf "local all all trust\nhostssl all mtlsuser 0.0.0.0/0 scram-sha-256 clientcert=verify-ca\nhost all all 0.0.0.0/0 scram-sha-256\n" > /tmp/pg_hba.conf && chown postgres /tmp/pg_hba.conf && exec docker-entrypoint.sh postgres -c ssl=on -c ssl_ca_file=/tmp/ca.pem -c ssl_cert_file=/tmp/server.pem -c ssl_key_file=/tmp/server.key -c hba_file=/tmp/pg_hba.conf'
          for i in $(seq 1 40); do
            docker exec mysql-tls ${{ matrix.mysql.name == 'MariaDB' && 'mariadb-admin' || 'mysqladmin' }} ping -h 127.0.0.1 -uroot -proot --silent 2>/dev/null && break
            sleep 2
          done
          docker exec mysql-tls ${{ matrix.mysql.name == 'MariaDB' && 'mariadb' || 'mysql' }} -uroot -proot -e "ALTER USER 'testuser'@'%' REQUIRE SSL; CREATE USER 'mtlsuser'@'%' IDENTIFIED BY 'testpass' REQUIRE X509; GRANT ALL ON testdb.* TO 'mtlsuser'@'%'; FLUSH PRIVILEGES;"
          for i in $(seq 1 20); do
            docker exec pg-tls pg_isready -U testuser -d testdb -q 2>/dev/null && break
            sleep 1
          done
          docker exec pg-tls psql -U testuser -d testdb -c "CREATE ROLE mtlsuser LOGIN PASSWORD 'testpass'; GRANT ALL ON DATABASE testdb TO mtlsuser;"

      - name: Driver + TransactionGuard integration tests
        # The real-backend tests live in the normal phpunit suite under
        # tests/Integration/, environment-gated: they skip without
        # MYSQL_HOST/POSTGRES_HOST set, so plain unit runs everywhere
        # else stay database-free. Same files run under coverage in the
        # SonarQube workflow. The *_TLS_* variables point TlsTest at the
        # certificate-configured servers started above.
        working-directory: packages/persistence
        run: vendor/bin/phpunit
        env:
          MYSQL_HOST: 127.0.0.1
          POSTGRES_HOST: 127.0.0.1
          MYSQL_TLS_HOST: 127.0.0.1
          MYSQL_TLS_PORT: 3307
          POSTGRES_TLS_HOST: 127.0.0.1
          POSTGRES_TLS_PORT: 5433
          TLS_CA: /tmp/tls-certs/ca.pem
          TLS_WRONG_CA: /tmp/tls-certs/wrong-ca.pem
          TLS_CLIENT_CERT: /tmp/tls-certs/client.pem
          TLS_CLIENT_KEY: /tmp/tls-certs/client.key

      - name: Cache Composer downloads
        uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/.composer-cache
          key: composer-${{ hashFiles('packages/*/composer.lock', 'tools/composer.lock') }}
          restore-keys: composer-
      - name: Install cache-redis dependencies
        working-directory: packages/cache-redis
        run: composer install --no-interaction --prefer-dist

      - name: RedisSimpleCache integration tests
        # Same shape as persistence above: env-gated tests under
        # tests/Integration/ that skip without REDIS_HOST, so plain unit
        # runs stay backend-free, and the same files run under coverage
        # in the SonarQube workflow.
        working-directory: packages/cache-redis
        run: vendor/bin/phpunit
        env:
          REDIS_HOST: 127.0.0.1

  mailer:
    name: mailer (Mailpit, PHP ${{ matrix.php-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php-version: ['8.4', '8.5']
    services:
      mailpit:
        image: axllent/mailpit
        ports:
          - 1025:1025
          - 8025:8025
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}

      - name: Cache Composer downloads
        uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/.composer-cache
          key: composer-${{ hashFiles('packages/*/composer.lock', 'tools/composer.lock') }}
          restore-keys: composer-
      - name: Install dependencies
        working-directory: packages/mailer
        run: composer install --no-interaction --prefer-dist

      - name: Run integration checks
        working-directory: packages/mailer
        run: php tests-integration/run.php
        env:
          MAILPIT_HOST: 127.0.0.1

  migrations:
    name: migrations (${{ matrix.mysql.name }} + Postgres, PHP ${{ matrix.php-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php-version: ['8.4', '8.5']
        mysql:
          - { name: MySQL, image: "mysql:8.4", healthCmd: "mysqladmin ping -h localhost -u root -proot" }
          - { name: MariaDB, image: "mariadb:11.4", healthCmd: "mariadb-admin ping -h localhost -u root -proot" }
    services:
      mysql:
        image: ${{ matrix.mysql.image }}
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: testdb
          MYSQL_USER: testuser
          MYSQL_PASSWORD: testpass
        ports:
          - 3306:3306
        options: >-
          --health-cmd="${{ matrix.mysql.healthCmd }}"
          --health-interval=5s --health-timeout=5s --health-retries=10
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: testdb
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpass
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U testuser"
          --health-interval=5s --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: pgsql

      - name: Cache Composer downloads
        uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/.composer-cache
          key: composer-${{ hashFiles('packages/*/composer.lock', 'tools/composer.lock') }}
          restore-keys: composer-
      - name: Install dependencies
        working-directory: packages/migrations
        run: composer install --no-interaction --prefer-dist

      - name: Run integration checks
        working-directory: packages/migrations
        run: php tests-integration/run.php
        env:
          MYSQL_HOST: 127.0.0.1
          POSTGRES_HOST: 127.0.0.1

      - name: Run the cross-process migration lock proof
        working-directory: packages/migrations
        run: php tests-integration/concurrent_lock.php
        env:
          MYSQL_HOST: 127.0.0.1
          POSTGRES_HOST: 127.0.0.1

  redis-cluster:
    name: cache-redis (Redis Cluster, PHP ${{ matrix.php-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php-version: ['8.4', '8.5']
    # Redis advertises container-internal addresses for cluster redirects.
    # The PHP job therefore joins the service container's Docker network.
    container:
      image: php:${{ matrix.php-version }}-cli-alpine
    services:
      redis-cluster:
        image: grokzen/redis-cluster:7.0.10
    env:
      REDIS_CLUSTER_SEEDS: redis-cluster:7000,redis-cluster:7001,redis-cluster:7002
    steps:
      # actions/checkout needs git to preserve export-ignored test files.
      - name: Install git
        run: apk add --no-cache git

      # The image reports cluster_state:ok before it finishes assigning replicas.
      - name: Wait for Redis Cluster to finish bootstrapping
        run: |
          apk add --no-cache redis
          for i in $(seq 1 30); do
            nodes=$(redis-cli -h redis-cluster -p 7000 cluster nodes 2>/dev/null || true)
            masters=$(echo "$nodes" | grep -c 'master' || true)
            replicas=$(echo "$nodes" | grep -c 'slave' || true)
            if [ "$masters" = "3" ] && [ "$replicas" = "3" ]; then
              echo "Cluster ready: 3 masters, 3 replicas."
              exit 0
            fi
            echo "Not ready yet (attempt $i/30, masters=$masters replicas=$replicas), waiting..."
            sleep 2
          done
          echo "Cluster did not reach a stable 3-master/3-replica split in time." >&2
          exit 1

      - uses: actions/checkout@v7

      - name: Install Composer
        run: |
          apk add --no-cache curl
          curl --fail --location --silent --show-error \
            --retry 5 --retry-all-errors --retry-delay 2 \
            --connect-timeout 15 --max-time 120 \
            --output /usr/local/bin/composer \
            https://github.com/composer/composer/releases/latest/download/composer.phar
          chmod +x /usr/local/bin/composer
          composer --version

      - name: Cache Composer downloads
        uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/.composer-cache
          key: composer-${{ hashFiles('packages/*/composer.lock', 'tools/composer.lock') }}
          restore-keys: composer-
      - name: Install dependencies
        working-directory: packages/cache-redis
        run: composer install --no-interaction --prefer-dist

      - name: Run integration tests twice against the same cluster
        # REDIS_CLUSTER_SEEDS comes from the job-level env above. The
        # single-node tests in the same suite skip here, since REDIS_HOST
        # is unset. The second run verifies that the first restored every
        # slot it changed.
        working-directory: packages/cache-redis
        run: |
          vendor/bin/phpunit
          vendor/bin/phpunit

  localstack:
    name: queue-sqs + storage-s3 (LocalStack, PHP ${{ matrix.php-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php-version: ['8.4', '8.5']
    services:
      localstack:
        image: localstack/localstack:3.0.2
        env:
          SERVICES: sqs,s3
        ports:
          - 4566:4566
        options: >-
          --health-cmd="curl -s http://localhost:4566/_localstack/health"
          --health-interval=5s --health-timeout=5s --health-retries=15
    env:
      LOCALSTACK_ENDPOINT: http://127.0.0.1:4566
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}

      - name: Cache Composer downloads
        uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/.composer-cache
          key: composer-${{ hashFiles('packages/*/composer.lock', 'tools/composer.lock') }}
          restore-keys: composer-
      - name: Install queue-sqs dependencies
        working-directory: packages/queue-sqs
        run: composer install --no-interaction --prefer-dist

      - name: queue-sqs integration checks
        working-directory: packages/queue-sqs
        run: php tests-integration/run.php

      - name: Cache Composer downloads
        uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/.composer-cache
          key: composer-${{ hashFiles('packages/*/composer.lock', 'tools/composer.lock') }}
          restore-keys: composer-
      - name: Install storage-s3 dependencies
        working-directory: packages/storage-s3
        run: composer install --no-interaction --prefer-dist

      - name: storage-s3 integration checks
        working-directory: packages/storage-s3
        run: php tests-integration/run.php

  pingpong:
    name: kinetis/pingpong (real demo, end-to-end)
    runs-on: ubuntu-latest
    # Brings up the real Docker Compose stack, hits the real routes,
    # polls the real database — a permanent regression check, rather
    # than something verified once by hand and never re-checked.
    # Deliberately its own job, not part of the per-package matrix
    # above: this exercises the whole compose stack (app, mysql, redis,
    # soketi, migrate, queue-worker, cron) together, not one package's
    # own composer dependencies in isolation.
    steps:
      - uses: actions/checkout@v7

      - name: Create .env from the committed example
        working-directory: packages/pingpong
        run: cp .env.example .env

      - name: Build and start the real stack
        working-directory: packages/pingpong
        run: docker compose up --build -d

      - name: Wait for the app to answer real requests
        run: |
          for i in $(seq 1 60); do
            if curl -sf --connect-timeout 5 --max-time 10 -o /dev/null http://localhost:8080/; then
              exit 0
            fi
            sleep 2
          done
          echo "App never became reachable on :8080" >&2
          exit 1

      - name: The application's own PHPUnit suite, inside the stack
        # Runs where the database actually is — ApplicationTestCase boots
        # the real app and DatabaseTransactions rolls each test back, so
        # this leaves ping_messages exactly as it found it. Not part of
        # ci.yml's per-package matrix, which has no database.
        working-directory: packages/pingpong
        run: docker compose exec -T app php vendor/bin/phpunit

      - name: GET / serves the dashboard
        run: |
          code=$(curl -s --connect-timeout 5 --max-time 10 -o /dev/null -w '%{http_code}' http://localhost:8080/)
          test "$code" = "200"

      - name: POST /pong/direct pongs synchronously, in the same request
        working-directory: packages/pingpong
        run: |
          code=$(curl -s --connect-timeout 5 --max-time 10 -o /dev/null -w '%{http_code}' -X POST http://localhost:8080/pong/direct)
          test "$code" = "200"
          row=$(docker compose exec -T mysql mysql -upingpong -ppingpong pingpong -N -e \
            "SELECT status FROM ping_messages WHERE scenario='direct' ORDER BY id DESC LIMIT 1;")
          test "$row" = "ponged"

      - name: POST /pong/queued is pending immediately, ponged later by the queue worker
        working-directory: packages/pingpong
        run: |
          code=$(curl -s --connect-timeout 5 --max-time 10 -o /dev/null -w '%{http_code}' -X POST http://localhost:8080/pong/queued)
          test "$code" = "200"

          row=$(docker compose exec -T mysql mysql -upingpong -ppingpong pingpong -N -e \
            "SELECT status FROM ping_messages WHERE scenario='queued' ORDER BY id DESC LIMIT 1;")
          test "$row" = "pending"

          for i in $(seq 1 30); do
            row=$(docker compose exec -T mysql mysql -upingpong -ppingpong pingpong -N -e \
              "SELECT status FROM ping_messages WHERE scenario='queued' ORDER BY id DESC LIMIT 1;")
            if [ "$row" = "ponged" ]; then
              exit 0
            fi
            sleep 2
          done
          echo "The queued ping was never ponged by the queue worker." >&2
          exit 1

      - name: The cron container creates and pongs its own rows with no request involved
        working-directory: packages/pingpong
        run: |
          for i in $(seq 1 30); do
            row=$(docker compose exec -T mysql mysql -upingpong -ppingpong pingpong -N -e \
              "SELECT status FROM ping_messages WHERE scenario='cron' ORDER BY id DESC LIMIT 1;" 2>/dev/null)
            if [ "$row" = "ponged" ]; then
              exit 0
            fi
            sleep 2
          done
          echo "No ponged cron-scenario row ever appeared." >&2
          exit 1

      - name: Dump container logs on failure
        if: failure()
        working-directory: packages/pingpong
        run: docker compose logs

      - name: Tear down
        if: always()
        working-directory: packages/pingpong
        run: docker compose down -v

  runtime-conformance:
    name: runtime conformance (${{ matrix.sapi.name }})
    runs-on: ubuntu-latest
    # The shared runtime conformance suite (Kinetis\Testing\Runtime)
    # against a real SAPI, not the php -S stand-in the committed framework
    # suite spawns: a FrankenPHP worker loop behind Caddy, and PHP-FPM
    # behind nginx. Each SAPI populates superglobals, folds repeated
    # headers, reports the client address, and streams a response through
    # its own code — this is the only place that code is exercised.
    #
    # The same shape as the local verification: the SAPI under test (one
    # FrankenPHP container; nginx plus a PHP-FPM container for the FPM
    # leg), and a php:8.4-cli-alpine runner on the same Docker network
    # running RemoteSuperglobalsConformanceTest against it. Every
    # container mounts the checkout at /app, so the fixture's state
    # directory is the same path on every side.
    strategy:
      fail-fast: false
      matrix:
        sapi:
          - name: frankenphp
          - name: fpm
    steps:
      - uses: actions/checkout@v7

      - name: Install framework dependencies
        run: docker run --rm -v "$PWD":/app -w /app/packages/framework composer:2 install --no-interaction --prefer-dist

      - name: Start the SAPI under test
        run: |
          docker network create conformance
          mkdir -p .conformance-state && chmod 777 .conformance-state
          FIXTURES=/app/packages/framework/tests/Runtime/Conformance/Fixtures
          case "${{ matrix.sapi.name }}" in
            frankenphp)
              docker run -d --name sapi --network conformance \
                -v "$PWD":/app \
                -v "$PWD/packages/framework/tests/Runtime/Conformance/Fixtures/php-conformance.ini":/usr/local/etc/php/conf.d/zz-conformance.ini:ro \
                -e KINETIS_CONFORMANCE_STATE_DIR=/app/.conformance-state \
                dunglas/frankenphp:latest \
                frankenphp php-server --listen :8080 --root "$FIXTURES" --worker "$FIXTURES/index.php"
              ;;
            fpm)
              docker run -d --name fpm --network conformance \
                -v "$PWD":/app \
                -v "$PWD/packages/framework/tests/Runtime/Conformance/Fixtures/php-conformance.ini":/usr/local/etc/php/conf.d/zz-conformance.ini:ro \
                -e KINETIS_CONFORMANCE_STATE_DIR=/app/.conformance-state \
                php:8.4-fpm-alpine
              docker run -d --name sapi --network conformance \
                -v "$PWD":/app:ro \
                -v "$PWD/packages/framework/tests/Runtime/Conformance/Fixtures/nginx.conf.template":/etc/nginx/templates/default.conf.template:ro \
                -e NGINX_PORT=8080 -e FPM_UPSTREAM=fpm:9000 -e FIXTURE_PATH="$FIXTURES/index.php" \
                nginx:alpine
              ;;
          esac

      - name: Wait for the fixture to answer through the whole SAPI path
        # A TCP accept is not readiness: nginx listens before the PHP-FPM
        # pool behind it does, and the first real request would get a
        # 502. /__conformance/ready goes through RuntimeDetector, the
        # adapter's run() loop, the bridge and the fixture's handler, and
        # answers 204 only once all of that does. The driver polls the
        # same endpoint itself; this step exists to fail with a clear
        # message and the SAPI's logs if the stack never comes up.
        run: |
          docker run --rm --network conformance php:8.4-cli-alpine php -r '
            $deadline = microtime(true) + 90; $last = "no connection";
            while (microtime(true) < $deadline) {
              if ($s = @stream_socket_client("tcp://sapi:8080", $e, $m, 1)) {
                stream_set_timeout($s, 2);
                fwrite($s, "GET /__conformance/ready HTTP/1.1\r\nHost: sapi:8080\r\nConnection: close\r\n\r\n");
                $line = trim((string) fgets($s)); fclose($s);
                if (str_starts_with($line, "HTTP/1.1 204") || str_starts_with($line, "HTTP/1.0 204")) { exit(0); }
                $last = $line !== "" ? $line : "an empty response";
              }
              usleep(250000);
            }
            fwrite(STDERR, "the fixture never answered /__conformance/ready with 204 (last seen: $last)\n");
            exit(1);
          '

      - name: Run the conformance suite against it
        # KINETIS_CONFORMANCE_CLIENT_IP is the runner container's own
        # address — what the SAPI reports as REMOTE_ADDR for it.
        run: |
          docker run --rm --network conformance -v "$PWD":/app -w /app/packages/framework \
            -e KINETIS_CONFORMANCE_HOST=sapi:8080 \
            -e KINETIS_CONFORMANCE_STATE_DIR=/app/.conformance-state \
            php:8.4-cli-alpine sh -c 'export KINETIS_CONFORMANCE_CLIENT_IP=$(hostname -i); php vendor/bin/phpunit --filter RemoteSuperglobalsConformanceTest'

      - name: SAPI logs
        if: failure()
        run: |
          docker logs sapi 2>&1 | tail -100
          docker logs fpm 2>&1 | tail -50 || true

  roadrunner-conformance:
    name: runtime conformance (roadrunner)
    runs-on: ubuntu-latest
    # RoadRunnerDriver is self-contained — it spawns `rr serve` (which in
    # turn spawns the PHP worker) as a real subprocess directly from
    # inside the test run, unlike FrankenPHP/nginx+FPM above, which need
    # a genuinely separate long-lived server container reachable over a
    # Docker network. That's why this job needs no `services:` block and
    # no multi-container orchestration: one runner, a real, prebuilt
    # `ext-sockets` via shivammathur/setup-php (see docs/runtime-adapters.md
    # — it compiles under Alpine too, just not worth doing here), a real
    # fetched `rr` binary, and the suite itself.
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: sockets

      - name: Cache Composer downloads
        uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/.composer-cache
          key: composer-${{ hashFiles('packages/*/composer.lock', 'tools/composer.lock') }}
          restore-keys: composer-

      - name: Install dependencies
        working-directory: packages/roadrunner-adapter
        run: composer install --no-interaction --prefer-dist

      # spiral/roadrunner-cli, a require-dev dependency — never fetched
      # via docker-php-ext-install or a package manager: composer.json's
      # own `filter`/`stability` are left at their real defaults
      # (`--no-config` only, so it doesn't also generate a `.rr.yaml`
      # RoadRunnerDriver::start() would just overwrite with its own per-
      # test-run one), confirmed for real during local development —
      # see this package's own tests/Conformance/RoadRunnerDriver.php.
      # get-binary itself leaves the downloaded file without the execute
      # bit — confirmed directly against a real fetch, not assumed —
      # so RoadRunnerDriver's own proc_open() call would fail to spawn
      # it without this.
      - name: Fetch a real rr binary
        working-directory: packages/roadrunner-adapter
        run: |
          php vendor/bin/rr get-binary --no-config --no-interaction -o linux -a amd64
          chmod +x rr

      # Two tests in the shared suite are excluded here, by name, both
      # real and both disclosed in RoadRunnerAdapter's own class
      # docblock rather than hidden: a purely-numeric header name is
      # deterministically dropped by an upstream spiral/roadrunner-http
      # bug before this adapter ever sees the request, and cookie order
      # is occasionally (~1 in 10 real runs) not preserved because
      # RoadRunner represents cookies as a Go map on the way to PHP,
      # whose iteration order Go randomizes by design. Neither is
      # reachable from inside this package's own code. The full,
      # unfiltered suite still runs — and still shows both, honestly —
      # for anyone running it directly against a real binary; this gate
      # only needs to be reliable.
      - name: Run the runtime conformance suite against it
        working-directory: packages/roadrunner-adapter
        run: php vendor/bin/phpunit --filter '^(?!.*(test_a_purely_numeric_header_name_survives|test_cookies_reach_both_the_cookie_header_and_cookie_params)$).*$' tests/RoadRunnerConformanceTest.php

  search-opensearch:
    name: search-opensearch (OpenSearch, PHP ${{ matrix.php-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php-version: ['8.4', '8.5']
    services:
      opensearch:
        image: opensearchproject/opensearch:2
        env:
          discovery.type: single-node
          DISABLE_SECURITY_PLUGIN: "true"
          OPENSEARCH_JAVA_OPTS: -Xms512m -Xmx512m
        ports:
          - 9200:9200
        options: >-
          --health-cmd="curl -sf http://localhost:9200/_cluster/health"
          --health-interval=5s --health-timeout=5s --health-retries=24
      opensearch-secure:
        image: opensearchproject/opensearch:2
        env:
          discovery.type: single-node
          OPENSEARCH_INITIAL_ADMIN_PASSWORD: Kinetis-CI-Verify-2026!
          OPENSEARCH_JAVA_OPTS: -Xms512m -Xmx512m
        ports:
          - 9201:9200
        options: >-
          --health-cmd="curl -sfk -u admin:Kinetis-CI-Verify-2026! https://localhost:9200/_cluster/health"
          --health-interval=5s --health-timeout=5s --health-retries=24
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}

      - name: Cache Composer downloads
        uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/.composer-cache
          key: composer-${{ hashFiles('packages/*/composer.lock', 'tools/composer.lock') }}
          restore-keys: composer-
      - name: Install dependencies
        working-directory: packages/search-opensearch
        run: composer install --no-interaction --prefer-dist

      - name: Run integration checks
        working-directory: packages/search-opensearch
        run: php tests-integration/opensearch.php
        env:
          SEARCH_OPENSEARCH_HOST: http://127.0.0.1:9200

      - name: Run auth/TLS integration checks
        working-directory: packages/search-opensearch
        run: php tests-integration/opensearch-auth.php
        env:
          SEARCH_OPENSEARCH_SECURE_HOST: https://127.0.0.1:9201
          SEARCH_OPENSEARCH_PASSWORD: Kinetis-CI-Verify-2026!
