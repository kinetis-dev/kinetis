name: Monorepo Validate

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]

# One run per branch at a time: a superseded PR push cancels the older
# run outright; on main nothing is cancelled, but stacked pushes queue
# as at most one pending run instead of piling their whole job matrix
# behind each other's. release.yml deliberately has no such block — a
# release in progress must never be cancelled or superseded.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  validate:
    name: Manifest + composer.json validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Check 4 (version-bump completeness) diffs the manifest against
          # GITHUB_EVENT_BEFORE (what main pointed to before this push) on
          # the push trigger, falling back to HEAD^ otherwise — see
          # tools/validate-manifest.php's oldManifestRef(). A multi-commit
          # push (this project's own normal workflow, not an edge case)
          # can put that ref arbitrarily far back, so full history is
          # needed here, matching sonarqube.yml's own fetch-depth: 0 for
          # the same class of need — a shallow fetch-depth: 2 only ever
          # covers a single-commit push correctly.
          fetch-depth: 0

      - name: Validate packages.manifest.json (cycles, version consistency, generated-file drift, version-bump completeness)
        # php:*-cli-alpine has no git binary, and validate-manifest.php's
        # own version-bump check needs it (git show <ref>:packages.manifest.json)
        # — same gotcha already documented in the redis-cluster job above.
        # GIT_CONFIG_* works around "detected dubious ownership": the
        # container runs as a different UID than the host checkout it
        # bind-mounts. GITHUB_EVENT_BEFORE is only meaningful for the push
        # trigger (github.event.before doesn't exist on a pull_request
        # payload, so this renders empty there — oldManifestRef() falls
        # back to HEAD^ in that case, same as a local run).
        run: |
          docker run --rm \
            -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0='*' \
            -e GITHUB_EVENT_BEFORE="${{ github.event.before }}" \
            -v "$PWD":/app -w /app php:8.4-cli-alpine sh -c "apk add --no-cache git >/dev/null 2>&1 && php tools/validate-manifest.php"

      - name: composer validate --strict (every package)
        # Not matrixed — each check is near-instant and there's no build
        # step to parallelize, so one job looping over all 19 is simpler
        # than spinning up 19 separate runner jobs for it. Collects every
        # failure before exiting, matching validate-manifest.php's own
        # "report everything, not just the first problem" behavior.
        run: |
          failed=""
          for pkg in framework persistence cache-redis bref-adapter query-builder auth auth-jwt migrations queue storage revolt-http-client storage-s3 queue-sqs queue-rabbitmq mailer search-opensearch aws-sigv4 pingpong skeleton; do
            echo "=== $pkg ==="
            if ! docker run --rm -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0='*' -v "$PWD":/app -w /app/packages/$pkg composer:2 validate --strict; then
              failed="$failed $pkg"
            fi
          done
          if [ -n "$failed" ]; then
            echo "::error::composer validate --strict failed for:$failed"
            exit 1
          fi
