name: Monorepo Validate

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]

# One run per branch at a time: a superseded PR push cancels the older
# run outright; on main nothing is cancelled, but stacked pushes queue
# as at most one pending run instead of piling their whole job matrix
# behind each other's. release.yml groups on a constant instead of this
# per-ref pair, and never cancels — see that file for why a publication
# needs both.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  validate:
    name: Manifest + composer.json validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The version-bump and content-bump checks diff the manifest
          # against a base commit: the PR's own base on a pull request,
          # GITHUB_EVENT_BEFORE (what main pointed to before this push) on
          # a push — see tools/git-history.php. Either can land
          # arbitrarily far back on a multi-commit branch or push (this
          # project's own normal workflow, not an edge case), so full
          # history is needed here, matching sonarqube.yml's own
          # fetch-depth: 0 for the same class of need. A base the
          # checkout can't reach fails the run rather than skipping those
          # two checks, so a shallow fetch here would not fail quietly —
          # it would just fail.
          fetch-depth: 0

      - name: Validate packages.manifest.json
        # php:*-cli-alpine has no git binary, and the version and content
        # checks need it (git show <ref>:packages.manifest.json, git diff)
        # — same gotcha already documented in the redis-cluster job above.
        # GIT_CONFIG_* works around "detected dubious ownership": the
        # container runs as a different UID than the host checkout it
        # bind-mounts.
        #
        # The two triggers name their base differently and only one of
        # them is ever set: github.event.before exists on push,
        # pull_request.base.sha on a pull request. Passing the PR base
        # explicitly measures the whole branch as one change, rather than
        # leaning on the merge commit's first parent happening to be the
        # base tip.
        env:
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          base_arg=""
          if [ -n "$PR_BASE_SHA" ]; then
            base_arg="--base=$PR_BASE_SHA"
          fi
          docker run --rm \
            -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0='*' \
            -e GITHUB_EVENT_BEFORE \
            -v "$PWD":/app -w /app php:8.4-cli-alpine sh -c "apk add --no-cache git >/dev/null 2>&1 && php tools/validate-manifest.php $base_arg"

      - name: composer validate --strict (every package)
        # Not matrixed — each check is near-instant and there's no build
        # step to parallelize, so one job looping over every package is simpler
        # than spinning up a separate runner job per package. Collects every
        # failure before exiting, matching validate-manifest.php's own
        # "report everything, not just the first problem" behavior.
        run: |
          failed=""
          for pkg in framework persistence cache-redis bref-adapter roadrunner-adapter query-builder auth auth-jwt authorization migrations mcp queue queue-redis queue-sql storage revolt-http-client storage-s3 queue-sqs queue-rabbitmq mailer broadcasting search-opensearch aws-sigv4 telemetry session pingpong skeleton; do
            echo "=== $pkg ==="
            if ! docker run --rm -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0='*' -v "$PWD":/app -w /app/packages/$pkg composer:2 validate --strict; then
              failed="$failed $pkg"
            fi
          done
          if [ -n "$failed" ]; then
            echo "::error::composer validate --strict failed for:$failed"
            exit 1
          fi
