name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  security-events: write
  actions: read

# One run per branch at a time: a superseded PR push cancels the older
# run outright; on main nothing is cancelled, but stacked pushes queue
# as at most one pending run instead of piling their whole job matrix
# behind each other's. release.yml groups on a constant instead of this
# per-ref pair, and never cancels — see that file for why a publication
# needs both.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  # The cache above removes almost every download; this covers what is
  # left — a cold cache, or a lock file that just changed. The job's own
  # ephemeral token lifts the anonymous codeload.github.com rate limit
  # that a run hit while fetching php-fig/log. No secret to provision.
  COMPOSER_AUTH: '{"github-oauth":{"github.com":"${{ secrets.GITHUB_TOKEN }}"}}'

jobs:
  changes:
    name: Detect changed areas
    runs-on: ubuntu-latest
    outputs:
      packages: ${{ steps.filter.outputs.packages }}
      docs: ${{ steps.filter.outputs.docs }}
    steps:
      # dorny/paths-filter needs a real checkout for a push trigger (it
      # diffs against the previous commit on the branch via plain git
      # commands there, unlike pull_request, which uses the GitHub API
      # instead) — fetch-depth: 0 so that previous commit is always
      # present, even for a multi-commit push.
      - uses: actions/checkout@v7
        if: github.event_name == 'push'
        with:
          fetch-depth: 0

      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            packages:
              - 'packages/**'
              - 'tools/**'
              # A version bump changes the manifest and nothing else,
              # since the generated composer.json carries no version
              # field. Without this entry a pull request that only bumps
              # a version would merge with its packages never validated,
              # audited, tested or analysed.
              - 'packages.manifest.json'
              - '.github/workflows/ci.yml'
            docs:
              - 'docs/**'
              - '.github/workflows/ci.yml'

  test:
    needs: changes
    # Every push to main runs the whole package matrix, whatever the push
    # touched. release-gate.php requires this workflow to have succeeded
    # at the exact commit being published, and a release round can publish
    # a version whose own push predates the current one — a docs-only push
    # that skipped the matrix would leave the gate proving nothing about
    # the package code it is about to tag. Pull requests keep the path
    # filter: nothing publishes from one.
    if: github.event_name == 'push' || needs.changes.outputs.packages == 'true'
    name: ${{ matrix.package.name }} (PHP ${{ matrix.php-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # PHP 8.5 added alongside the existing 8.4 leg: dunglas/frankenphp
        # — the documented primary deployment target — already ships PHP
        # 8.5, which no CI job previously exercised at all.
        php-version: ['8.4', '8.5']
        package:
          - { name: core, dir: packages/framework, phpunit: true }
          # The native pgsql driver refuses to construct without ext-sockets.
          - { name: persistence, dir: packages/persistence, phpunit: true, needsSockets: true }
          - { name: redis, dir: packages/redis, phpunit: true }
          - { name: cache-redis, dir: packages/cache-redis, phpunit: true }
          - { name: bref-adapter, dir: packages/bref-adapter, phpunit: true }
          # ext-sockets — a real, hard `require` of spiral/roadrunner-worker
          # — compiles under Alpine fine, but needs `linux-headers` on top
          # of the usual `$PHPIZE_DEPS` (confirmed directly; see
          # docs/runtime-adapters.md), and every step below is its own
          # separate, stateless container — installing/PHPStan/Psalm x2/
          # PHPUnit — so compiling it from source five times per PHP
          # version, on every push, for an extension nothing this
          # package's own code, PHPStan, Psalm, or its committed (real-
          # binary-free) unit suite ever loads, is real wasted cost with
          # nothing to show for it. Composer's own platform check is
          # bypassed here instead. RoadRunnerConformanceTest (the real-rr-
          # binary suite) needs both a real binary and a genuinely loaded
          # ext-sockets, and runs in integration.yml's dedicated job
          # instead, on a native runner via shivammathur/setup-php — a
          # prebuilt extension there, not a from-source Alpine compile;
          # it skips itself cleanly here with neither present.
          - { name: roadrunner-adapter, dir: packages/roadrunner-adapter, phpunit: true, composerFlags: "--ignore-platform-req=ext-sockets" }
          - { name: query-builder, dir: packages/query-builder, phpunit: true }
          - { name: auth, dir: packages/auth, phpunit: true }
          - { name: auth-jwt, dir: packages/auth-jwt, phpunit: true }
          - { name: migrations, dir: packages/migrations, phpunit: true }
          - { name: mcp, dir: packages/mcp, phpunit: true }
          - { name: mcp-docs, dir: packages/mcp-docs, phpunit: true, needsBash: true }
          - { name: queue, dir: packages/queue, phpunit: true }
          - { name: queue-redis, dir: packages/queue-redis, phpunit: true }
          - { name: queue-sql, dir: packages/queue-sql, phpunit: true }
          - { name: storage, dir: packages/storage, phpunit: true }
          - { name: revolt-http-client, dir: packages/revolt-http-client, phpunit: true }
          - { name: aws-sigv4, dir: packages/aws-sigv4, phpunit: true }
          - { name: storage-s3, dir: packages/storage-s3, phpunit: true }
          - { name: queue-sqs, dir: packages/queue-sqs, phpunit: true }
          - { name: queue-rabbitmq, dir: packages/queue-rabbitmq, phpunit: true }
          - { name: mailer, dir: packages/mailer, phpunit: true }
          - { name: broadcasting, dir: packages/broadcasting, phpunit: true }
          - { name: search-opensearch, dir: packages/search-opensearch, phpunit: true }
          - { name: telemetry, dir: packages/telemetry, phpunit: true }
          - { name: session, dir: packages/session, phpunit: true }
          - { name: authorization, dir: packages/authorization, phpunit: true }
          - { name: pingpong, dir: packages/pingpong, phpunit: true }
          - { name: skeleton, dir: packages/skeleton, phpunit: true }
          - { name: tools, dir: tools, phpunit: true, needsGit: true }
    steps:
      - uses: actions/checkout@v7

      # ~95 composer installs run across this pipeline per push, each
      # resolving about a hundred packages, and their dependency sets
      # overlap almost entirely — the whole universe is 22 MB. Without a
      # cache that is ~9,500 unauthenticated zip downloads from
      # codeload.github.com per push, concurrent, from one address, which
      # is how a run failed on "HTTP/2 429" while fetching php-fig/log. A
      # warm cache installs the same hundred packages with the network
      # switched off entirely.
      #
      # One key across every lock file rather than one per package: the
      # sharing between packages is what makes this work, and 22 MB is
      # small enough that a single lock change re-downloading everything
      # costs seconds.
      - name: Cache Composer downloads
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/composer-cache
          key: composer-${{ hashFiles('packages/*/composer.lock', 'tools/composer.lock') }}
          restore-keys: composer-

      - name: Validate composer.json
        # GIT_CONFIG_* env vars work around "detected dubious ownership" —
        # the container runs as a different UID than the host checkout it
        # bind-mounts, which git (invoked internally by Composer for
        # path-repo version resolution) refuses by default.
        run: docker run --rm -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0='*' -v "$PWD":/app -w /app/${{ matrix.package.dir }} composer:2 validate --strict

      - name: Install dependencies
        run: docker run --rm -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0='*' -e COMPOSER_AUTH -v "$PWD":/app -v "${{ runner.temp }}/composer-cache":/tmp/cache -w /app/${{ matrix.package.dir }} composer:2 install --no-interaction --prefer-dist ${{ matrix.package.composerFlags }}

      - name: Composer audit
        run: docker run --rm -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0='*' -v "$PWD":/app -w /app/${{ matrix.package.dir }} composer:2 audit

      - name: PHPUnit
        if: matrix.package.phpunit && !matrix.package.needsGit && !matrix.package.needsSockets && !matrix.package.needsBash
        run: docker run --rm -v "$PWD":/app -w /app/${{ matrix.package.dir }} php:${{ matrix.php-version }}-cli-alpine php vendor/bin/phpunit

      - name: PHPUnit (needs ext-sockets — linux-headers on top of $PHPIZE_DEPS under Alpine)
        if: matrix.package.phpunit && matrix.package.needsSockets
        run: docker run --rm -v "$PWD":/app -w /app/${{ matrix.package.dir }} php:${{ matrix.php-version }}-cli-alpine sh -c "apk add --no-cache --virtual .build \$PHPIZE_DEPS linux-headers >/dev/null && docker-php-ext-install sockets >/dev/null && php vendor/bin/phpunit"

      # setup.sh is a bash script - it builds the docker command as an
      # array - and mcp-docs' suite runs it against stand-in binaries.
      # Alpine ships no bash.
      - name: PHPUnit (needs bash — mcp-docs' suite drives setup.sh)
        if: matrix.package.phpunit && matrix.package.needsBash
        run: docker run --rm -v "$PWD":/app -w /app/${{ matrix.package.dir }} php:${{ matrix.php-version }}-cli-alpine sh -c "apk add --no-cache bash >/dev/null && php vendor/bin/phpunit"

      # git-subtree is its own Alpine package. The publication splits
      # each package out with `git subtree split`, and this suite runs
      # that command against a scratch repository.
      - name: PHPUnit (needs a real git binary — tools/'s own suite shells out to it)
        if: matrix.package.phpunit && matrix.package.needsGit
        run: docker run --rm -v "$PWD":/app -w /app/${{ matrix.package.dir }} php:${{ matrix.php-version }}-cli-alpine sh -c "apk add --no-cache git git-subtree >/dev/null 2>&1 && php vendor/bin/phpunit"

      - name: PHPStan
        run: docker run --rm -v "$PWD":/app -w /app/${{ matrix.package.dir }} php:${{ matrix.php-version }}-cli-alpine php vendor/bin/phpstan analyse --no-progress --memory-limit=512M

      # Two Psalm passes, deliberately: --taint-analysis reports taint
      # issues only, suppressing every ordinary issue type — a plain run
      # is what catches those.
      - name: Psalm
        run: docker run --rm -v "$PWD":/app -w /app/${{ matrix.package.dir }} php:${{ matrix.php-version }}-cli-alpine php vendor/bin/psalm --no-progress

      - name: Psalm (taint analysis)
        run: docker run --rm -v "$PWD":/app -w /app/${{ matrix.package.dir }} php:${{ matrix.php-version }}-cli-alpine php vendor/bin/psalm --taint-analysis --no-progress --report=psalm.sarif --report-show-info=false

      - name: Upload Psalm SARIF to code scanning
        # Requires GitHub Code Security enabled on the repo to work while
        # private (free automatically once public) — soft-fails until
        # then rather than reddening every run over a dashboard step.
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: ${{ matrix.package.dir }}/psalm.sarif
          category: psalm-${{ matrix.package.name }}

  docs:
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    name: docs build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build Sphinx docs
        run: |
          docker run --rm -v "$PWD/docs":/app -w /app python:3.12-slim \
            bash -c "pip install -q -r requirements.txt && sphinx-build -M html . _build -W --keep-going"
