name: Release

on:
  push:
    branches: [main]

permissions:
  contents: read
  # The gate reads this repository's own workflow runs.
  actions: read

# One publication at a time across the whole repository, and never
# cancelled.
#
# The group is a constant rather than the usual workflow-and-ref pair
# every other workflow here uses: two pushes to main are two runs of this
# one workflow on the same ref, so a per-ref group would still let them
# publish side by side — and the older round finishing its push last is
# how a split repository ends up with main behind its own tag.
# cancel-in-progress: false is the other half of it: a publication killed
# between two repositories leaves exactly the partial state this workflow
# works to avoid.
#
# GitHub keeps at most one pending run per group and discards the rest,
# so an intermediate commit's turn here can be dropped entirely. What the
# next round recovers is a version still current: tools/release-plan.php
# looks for versions that are not fully published as well as for versions
# that changed in this push, and the manifest states one version per
# package. A version that was superseded before its own run started is
# gone from the manifest and is not published later — the predecessor
# check in the plan fails that round rather than tagging over the gap.
concurrency:
  group: kinetis-release-publication
  cancel-in-progress: false

jobs:
  release:
    name: Publish this round's release candidates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The plan reads the manifest's own history for the comparison
          # base, which can land arbitrarily far back on a multi-commit
          # push. A shallow checkout fails the run rather than guessing.
          fetch-depth: 0
          # actions/checkout's default (persist-credentials: true) writes
          # the ephemeral per-job GITHUB_TOKEN into the local git config
          # as a credential override for every https://github.com/ URL.
          # It would then authenticate the publication's own pushes as
          # github-actions[bot], an identity with no access outside this
          # one checked-out repository, and it would do so ahead of the
          # askpass helper the publish step provides. false stops
          # checkout from persisting any credential at all.
          persist-credentials: false

      # PHP runs on the runner rather than in a container for this one
      # workflow: the publication drives git and the pushes as a single
      # process, and that process needs the same git the checkout used.
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      - name: Compute this round's release plan
        id: plan
        # pipefail so a plan that fails — a malformed manifest, a base
        # commit git can't read, a split repository that can't be reached
        # — takes the step down with it. Without it, tee's own success is
        # the pipeline's exit status and the failure reaches jq as an
        # empty file.
        env:
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}
        run: |
          set -o pipefail
          php tools/release-plan.php --json | tee plan.json
          echo "count=$(jq '.candidates | length' plan.json)" >> "$GITHUB_OUTPUT"
          echo "ok=$(jq -r '.ok' plan.json)" >> "$GITHUB_OUTPUT"

      - name: Nothing to release
        if: steps.plan.outputs.count == '0'
        run: echo "Every current version is already published — nothing to release."

      - name: Fail — a candidate can't be published as it stands
        # Either a sibling requirement doesn't resolve (two packages
        # bumped together whose constraints don't line up), or a
        # version doesn't follow what its split repository publishes.
        # Both are decided by a person, not by this round.
        if: steps.plan.outputs.count != '0' && steps.plan.outputs.ok != 'true'
        run: |
          echo "::error::One or more release candidates cannot be published as they stand:"
          jq -r '.candidates[].problems[]' plan.json | while IFS= read -r line; do echo "::error::${line}"; done
          exit 1

      - name: Gate on this exact commit's own checks
        if: steps.plan.outputs.count != '0' && steps.plan.outputs.ok == 'true'
        # The job's own ephemeral token, scoped to actions: read above.
        # The deploy credential is not available to this step and has no
        # use here.
        env:
          GH_TOKEN: ${{ github.token }}
        run: php tools/release-gate.php --sha="${{ github.sha }}" --repo="${{ github.repository }}"

      - name: Publish each candidate, in order
        if: steps.plan.outputs.count != '0' && steps.plan.outputs.ok == 'true'
        # The only step the deploy credential exists for, and the only
        # one that writes: it stages each package's release-mode
        # composer.json in this runner's own disposable checkout, splits
        # the package out with the runner's own git, and updates that
        # repository's main branch and version tag in one atomic push.
        # tools/release-publish.php states what that push guarantees and
        # where the credential is allowed to be.
        env:
          RELEASE_DEPLOY_TOKEN: ${{ secrets.RELEASE_DEPLOY_TOKEN }}
        run: php tools/release-publish.php --plan=plan.json
