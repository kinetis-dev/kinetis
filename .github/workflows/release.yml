name: Release

on:
  push:
    branches: [main]

permissions:
  contents: read
  # The gate reads this repository's own workflow runs and their jobs.
  actions: read

# One publication at a time across the whole repository, and never
# cancelled.
#
# The group is a constant rather than the usual workflow-and-ref pair
# every other workflow here uses: two pushes to main are two runs of this
# one workflow on the same ref, so a per-ref group would still let them
# publish side by side — and the older round finishing its push last is
# how a split repository ends up with main behind its own tag.
# cancel-in-progress: false is the other half of it: a publication killed
# between two repositories leaves exactly the partial state this workflow
# works to avoid.
#
# GitHub keeps at most one pending run per group and discards the rest,
# so an intermediate commit's turn here can be dropped entirely. That is
# why tools/release-transaction.php refuses to publish a version whose
# predecessor was never tagged instead of quietly releasing over it.
concurrency:
  group: kinetis-release-publication
  cancel-in-progress: false

jobs:
  release:
    name: Publish this round's release candidates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The release plan and the publication both read the manifest's
          # own history — the comparison base for a multi-commit push, and
          # the version each package carried before the current one. Both
          # can land arbitrarily far back, and a shallow checkout fails
          # the run rather than guessing.
          fetch-depth: 0
          # actions/checkout's default (persist-credentials: true) writes
          # the ephemeral per-job GITHUB_TOKEN into the local git config
          # as a credential override for every https://github.com/ URL.
          # It would then authenticate the publication's own pushes as
          # github-actions[bot], an identity with no access outside this
          # one checked-out repository, and it would do so ahead of the
          # askpass helper the apply step provides. false stops checkout
          # from persisting any credential at all.
          persist-credentials: false

      # PHP runs on the runner rather than in a container for this one
      # workflow: the publication drives git and the pushes as a single
      # process, so the credential boundary and the preflight are one
      # decision rather than a shell loop's worth, and that process needs
      # the same git the checkout used.
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      - name: Compute this round's release plan
        id: plan
        # pipefail so a plan that fails — a malformed manifest, a base
        # commit git can't read, a graph with no publish order — takes
        # the step down with it. Without it, tee's own success is the
        # pipeline's exit status and the failure reaches jq as an empty
        # file.
        env:
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}
        run: |
          set -o pipefail
          php tools/release-plan.php --json | tee plan.json
          echo "count=$(jq '.candidates | length' plan.json)" >> "$GITHUB_OUTPUT"
          echo "ok=$(jq -r '.ok' plan.json)" >> "$GITHUB_OUTPUT"

      - name: Nothing to release
        if: steps.plan.outputs.count == '0'
        run: echo "Every current version is already published — nothing to release."

      - name: Fail — a candidate's sibling requirement isn't published yet
        # Two packages bumped together in one commit, but their sibling
        # ordering doesn't actually resolve (e.g. a version was bumped
        # without the dependent's own constraint catching up).
        if: steps.plan.outputs.count != '0' && steps.plan.outputs.ok != 'true'
        run: |
          echo "::error::One or more release candidates have an unresolved sibling requirement:"
          jq -r '.candidates[].problems[]' plan.json | while IFS= read -r line; do echo "::error::${line}"; done
          exit 1

      - name: Gate on this exact commit's own checks
        if: steps.plan.outputs.count != '0' && steps.plan.outputs.ok == 'true'
        # The job's own ephemeral token, scoped to actions: read above.
        # The deploy credential is not available to this step and has no
        # use here.
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}
        run: php tools/release-gate.php --sha="${{ github.sha }}" --repo="${{ github.repository }}"

      - name: Preflight the whole publication
        if: steps.plan.outputs.count != '0' && steps.plan.outputs.ok == 'true'
        # Stages the round, builds every candidate's publication commit
        # on what its repository already publishes, reads every target
        # repository, and writes the exact ref updates to make. Reaches
        # the network only to read, and writes nothing to any remote, so
        # it runs without the deploy credential.
        run: php tools/release-transaction.php preflight --plan=plan.json --out=transaction.json

      - name: Publish
        if: steps.plan.outputs.count != '0' && steps.plan.outputs.ok == 'true'
        # The only step the deploy credential exists for, and the only
        # one that writes. It re-derives every object the transaction
        # names against this checkout before taking the credential at
        # all, then reaches git through an askpass helper reading this
        # step's environment — never a URL, an argument, or a config
        # value, all of which git copies into its own output.
        env:
          RELEASE_DEPLOY_TOKEN: ${{ secrets.RELEASE_DEPLOY_TOKEN }}
        run: php tools/release-transaction.php apply --transaction=transaction.json
