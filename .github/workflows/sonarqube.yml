name: SonarQube Cloud

on:
  push:
    branches: [main]
    paths:
      - 'packages/**'
      - 'sonar-project.properties'
      - '.github/workflows/sonarqube.yml'
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'packages/**'
      - 'sonar-project.properties'
      - '.github/workflows/sonarqube.yml'

jobs:
  sonarqube:
    name: SonarQube Cloud scan
    runs-on: ubuntu-latest
    # The databases exist for one reason: persistence's env-gated
    # tests/Integration suite must run *under pcov here* so the native
    # drivers' real-backend exercise counts as measured coverage —
    # without them those tests skip and the driver code reads as
    # uncovered.
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: testdb
          MYSQL_USER: testuser
          MYSQL_PASSWORD: testpass
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -u root -proot"
          --health-interval=5s --health-timeout=5s --health-retries=10
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: testdb
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpass
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U testuser"
          --health-interval=5s --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@v7
        with:
          # SonarQube Cloud's new-code/blame analysis needs real history,
          # not the default single-commit shallow clone.
          fetch-depth: 0

      - name: Start Redis backends
        # cache-redis's env-gated tests/Integration suite must run under
        # pcov here for the same reason persistence's does. Both backends
        # are started by hand rather than declared as services: a Redis
        # Cluster node answers CLUSTER SHARDS and MOVED with its own
        # container address, so the test process has to sit on the same
        # Docker network to follow the redirect at all.
        run: |
          docker network create kinetis-redis
          docker run -d --name kinetis-redis --network kinetis-redis redis:7-alpine
          docker run -d --name kinetis-redis-cluster --network kinetis-redis grokzen/redis-cluster:7.0.10
          # grokzen's entrypoint first creates six independent masters and
          # only then attaches three of them as replicas, so cluster_state:ok
          # arrives well before the topology settles. Wait for the split.
          ready=""
          for i in $(seq 1 40); do
            roles=$(docker exec kinetis-redis-cluster redis-cli -p 7000 cluster nodes 2>/dev/null | sed 's/myself,//' | awk '{print $3}' | sort | uniq -c | tr -d ' \n')
            case "$roles" in
              *3master*3slave*) ready=yes; echo "Cluster ready: 3 masters, 3 replicas."; break ;;
            esac
            sleep 2
          done
          if [ -z "$ready" ]; then
            echo "Cluster did not reach a stable 3-master/3-replica split in time." >&2
            exit 1
          fi
          CLUSTER_IP=$(docker inspect kinetis-redis-cluster --format '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}')
          echo "REDIS_CLUSTER_SEEDS=$CLUSTER_IP:7000,$CLUSTER_IP:7001,$CLUSTER_IP:7002" >> "$GITHUB_ENV"

      - name: Package coverage
        # Same Docker-based pattern every other workflow here uses
        # (php:8.4-cli-alpine via `docker run`, not a host-level PHP setup
        # action) — pcov installed via pecl inside the container, the
        # identical snippet infection.yml's own coverage step already
        # uses. GIT_CONFIG_* works around "detected dubious ownership":
        # the container runs as a different UID than the host checkout it
        # bind-mounts, which git (invoked internally by Composer for
        # path-repo version resolution) refuses by default.
        run: |
          for pkg in framework persistence cache-redis auth auth-jwt bref-adapter mailer migrations query-builder queue queue-rabbitmq queue-sqs revolt-http-client aws-sigv4 search-opensearch session skeleton storage storage-s3 telemetry; do
            # persistence's env-gated tests/Integration suite talks to the
            # job's MySQL/Postgres services and needs the driver
            # extensions; every other package needs none.
            EXTRA_EXTS=""
            if [ "$pkg" = "persistence" ]; then EXTRA_EXTS="mysqli pdo_mysql pgsql pdo_pgsql"; fi
            # cache-redis joins the Redis network started above instead of
            # the host one, so cluster redirects resolve; every other
            # package reaches the database services over --network host.
            NETWORK="host"
            # Passed only where it is wanted: an empty value is a value,
            # and a package that reads REDIS_HOST would treat it as a
            # configured cache.
            REDIS_ENV=""
            if [ "$pkg" = "cache-redis" ]; then NETWORK="kinetis-redis"; REDIS_ENV="-e REDIS_HOST=kinetis-redis"; fi
            docker run --rm -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0='*' -v "$PWD":/app -w "/app/packages/$pkg" composer:2 install --no-interaction --prefer-dist
            docker run --rm --network "$NETWORK" -e MYSQL_HOST=127.0.0.1 -e POSTGRES_HOST=127.0.0.1 $REDIS_ENV -e REDIS_CLUSTER_SEEDS -e EXTRA_EXTS="$EXTRA_EXTS" -v "$PWD":/app -w "/app/packages/$pkg" php:8.4-cli-alpine sh -c "
              apk add --no-cache gcc g++ make autoconf pkgconf re2c
              if [ -n \"\$EXTRA_EXTS\" ]; then apk add --no-cache postgresql-dev && docker-php-ext-install \$EXTRA_EXTS; fi
              pecl install pcov
              echo 'extension=pcov.so' > /usr/local/etc/php/conf.d/pcov.ini
              php vendor/bin/phpunit --coverage-clover=coverage.xml
            "
          done

      - name: SonarQube Cloud scan
        uses: SonarSource/sonarqube-scan-action@v8
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: SonarQube Cloud quality gate
        # Fails the build if the gate fails — the scan step above only
        # ever uploads results; nothing checked the outcome before this.
        # Reads the scan step's own report-task.txt (the scanner writes
        # it to .scannerwork/ by default, which this action already knows
        # to look for) and polls SonarQube Cloud until the gate resolves.
        uses: SonarSource/sonarqube-quality-gate-action@v1
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
